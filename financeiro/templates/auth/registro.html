{% extends 'base.html' %}
{% block title %}Registro | Finança Familiar{% endblock %}
{% block auth_content %}
    <div class="min-vh-100 d-flex align-items-center justify-content-center" style="background:linear-gradient(135deg,#1a3a5c,#0f2540);">
        <div class="card" style="width:100%;max-width:480px;">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="bi bi-person-plus-fill fs-1" style="color:#1a3a5c"></i>
                    <h3 class="mt-2 fw-bold">Criar uma Conta</h3>
                </div>
                <form method="post">
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label fw-semibold">{{ field.label }}</label>
                            <input type="{{ field.field.widget.input_type }}" name="{{ field.html_name }}" 
                            class="form-control fom-control-lg {% if field.errors %}is-invalid{% endif %}" 
                            {% if field.value %}value="{{ field.value }}"{% endif %}>
                            {% for err in field.errors %}<div class="invalid-feedback">{{ err }}</div>{% endfor %}
                        </div>
                    {% endfor %}
                    <button type="submit" class="btn btn-success btn-lg w-100 mt-2">Criar Conta</button>
                </form>
                <hr>
                <p class="text-center text-muted">Já tem uma conta??? <a href="{% url 'financeiro:login' %}">Entrar</a></p>
            </div>
        </div>
    </div>
{% endblock %}
